name: Draw GitHub profile koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes

      - name: Render profile koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: JishnuPG-tech
          body: white
          output-dir: koi
          token: ${{ github.token }}

      - name: Commit generated koi assets
        shell: bash
        run: |
          if git diff --quiet -- koi github-metrics.svg && test -z "$(git status --porcelain -- koi github-metrics.svg)"; then
            echo "Koi assets are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi github-metrics.svg
          git commit -m "chore: update profile koi"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase -X theirs origin main
          done
          echo "Unable to publish generated profile assets after three attempts." >&2
          exit 1
